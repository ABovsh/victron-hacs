sonar.organization=abovsh
sonar.projectKey=ABovsh_victron-hacs
sonar.host.url=https://sonarcloud.io

# Free plan analyzes only the main branch. Pin every scan to main so any other
# branch refreshes the main project entry instead of attempting branch analysis.
sonar.branch.name=main

sonar.sources=custom_components/victron_ble
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# device.py is a 677-line parser for a dozen Victron product families. Only the
# battery-monitor branch runs on the hardware this fork is maintained against;
# the rest cannot be exercised without those devices, so measuring its coverage
# reports a number nobody can act on.
sonar.coverage.exclusions=custom_components/victron_ble/device.py

# Rules that are false positives in pytest code:
#   S1244 — float equality assertions
#   S7503 — async test functions with no await
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**
# S7503 in production source: Home Assistant requires entry hooks
# (async_setup_entry, async_unload_entry, async_reload_entry) to be `async def`
# even when the body never awaits. Removing `async` breaks the HA contract.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e3.resourceKey=custom_components/victron_ble/**
