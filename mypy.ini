[mypy]
# The manifest requires Home Assistant 2025.1, which runs on Python 3.13, and
# CI tests on 3.13. 3.9 was an upstream template leftover and made mypy reject
# `X | Y` unions and `datetime.UTC` that run fine everywhere this ships.
python_version = 3.13
follow_imports = silent
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
